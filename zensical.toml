[project]
site_url = "https://www.example.com/"
site_name = "Documentation 2.0"
site_description = "Lorem ipsum dolor sit amet, consectetur adipiscing elit."
site_author = "Artur H."
extra_css = ["stylesheets/extra.css"]
copyright = """
  Copyright &copy; 2026 Artur LLC –
  <a href="#__consent">Change cookie settings</a>
"""

repo_url = "https://github.com/user/repo"
repo_name = "Test/test"
# repo = "fontawesome/brands/git-alt"
edit_uri = "edit/main/docs/"

nav = [{ "Get started" = "index.md" }, { "Markdown in 5min" = "markdown.md" }]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
#variant = "modern" # oder "classic"
custom_dir = "overrides"
favicon = "Profile_logo.png"
logo = "Profile_logo.png"
language = "de"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",

]

[project.theme.icon]
logo = "lucide/smile"
repo = "fontawesome/brands/github"

[project.theme.font]
text = "Inter"
code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "red"
accent = "red"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "red"
accent = "red"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "red"
accent = "red"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = ""
name = "TEST"

[[project.extra.social]]
icon = "fontawesome/brands/x-twitter"
link = ""
name = "TEST"

[[project.extra.social]]
icon = "fontawesome/brands/facebook"
link = ""
name = "TEST"

[[project.extra.social]]
icon = "fontawesome/brands/instagram"
link = ""
name = "TEST"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = ""
name = "TEST"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = ""
name = "TEST"

[project.extra]
generator = false
alternate = [
  { name = "WORK IN PROGRESS", link = "", lang = "" },
  { name = "English", link = "/en/", lang = "en" },
  { name = "Deutsch", link = "/de/", lang = "de" },
  { name = "Armenian", link = "/hy/", lang = "hy" },
  { name = "Japanese", link = "/ja/", lang = "ja" },
  { name = "French", link = "/fr/", lang = "fr" },
  { name = "Russian", link = "/ru/", lang = "ru" },
  { name = "Spanish", link = "/es/", lang = "es" },
  { name = "Italian", link = "/it/", lang = "it" },
]

[project.extra.consent]
title = "Cookie consent"
description = """
  We use cookies to recognize your repeated visits and preferences, as well
  as to measure the effectiveness of our documentation and whether users
  find what they're searching for. With your consent, you're helping us to
  make our documentation better.
"""
actions = ["accept", "reject", "manage"]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
