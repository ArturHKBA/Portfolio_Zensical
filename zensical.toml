[project.extra]
generator = false
alternate = [
  { name = "WORK IN PROGRESS", link = "", lang = "" },
  { name = "English", link = "/en/", lang = "en" },
  { name = "Deutsch", link = "/de/", lang = "de" },
  { name = "Armenian", link = "/hy/", lang = "hy" },
  { name = "Japanese", link = "/ja/", lang = "ja" },
  { name = "French", link = "/fr/", lang = "fr" },
  { name = "Russian", link = "/ru/", lang = "ru" },
  { name = "Spanish", link = "/es/", lang = "es" },
  { name = "Italian", link = "/it/", lang = "it" },
]

[project.plugins.search]
enabled = true

[project.plugins.blog]

[project.plugins.tags]

[project.extra.tags]
Compatibility = "TEST"

[project.theme.icon.tag]
default = "img/alien"
Compatibility = "img/alien"

[project.extra.consent]
title = "Cookie consent"
description = """
  We use cookies to recognize your repeated visits and preferences, as well
  as to measure the effectiveness of our documentation and whether users
  find what they're searching for. With your consent, you're helping us to
  make our documentation better.
"""
actions = ["accept", "reject", "manage"]

#[project.validation]
#invalid_links = false
#invalid_link_anchors = false
#unresolved_references = false
#unresolved_footnotes = false
#unused_definitions = false
#unused_footnotes = false
#shadowed_definitions = false
#shadowed_footnotes = false

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.options.custom_icons = ["overrides/.icons"]
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
