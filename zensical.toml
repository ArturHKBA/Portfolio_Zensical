[project.theme]
#variant = "modern" # oder "classic"
custom_dir = "overrides"
favicon = "img/profile_logo.png"
logo = "img/profile_logo.png"
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide", # Versteckt oben automatisch
  "navigation.expand",
  "navigation.footer",
  # "navigation.indexes",          #NICHT KOMPATIBEL MIT toc.integrate
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  # "navigation.prune", # NICHT KOMPATIBEL MIT navigation.expand
  #"navigation.sections",
  "navigation.tabs",
  "navigation.path",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
  "toc.integrate",

]


[project.theme.icon]
logo = "lucide/smile"
repo = "fontawesome/brands/github"

[project.theme.font]
text = "Inter"
code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "red"
accent = "red"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "red"
accent = "red"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "red"
accent = "red"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = ""
name = "TEST"

